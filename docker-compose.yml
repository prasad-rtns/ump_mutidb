version: '3.9'

services:
  # ─── Infrastructure ───────────────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: ump_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ump_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ump_pass_2024}
      POSTGRES_DB: ${POSTGRES_DB:-ump_auth}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-postgres.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - ump_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ump_user} -d ${POSTGRES_DB:-ump_auth}"]
      interval: 10s
      timeout: 5s
      retries: 5
  mongodb:
    image: mongo:7.0
    container_name: ump_mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-ump_user}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-ump_pass}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-ump_db}
    ports:
      - "27022:27017"
    volumes:
      - mongo_data:/data/db
      - ./scripts/init-mongo.js:/docker-entrypoint-initdb.d/init.js
    networks:
      - ump_network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
  redis:
    image: redis:7-alpine
    container_name: ump_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_pass_2024} --appendonly yes
    ports:
      - "6389:6379"
    volumes:
      - redis_data:/data
    networks:
      - ump_network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_pass_2024}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Microservices ────────────────────────────────────────────────────────────
  auth-service:
    build:
      context: ./auth-service
    container_name: ump_auth_service
    restart: unless-stopped
    env_file: ./auth-service/.env
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_pass_2024}@redis:6379
    ports:
      - "6001:6001"
    depends_on:
      postgres: { condition: service_healthy }
      mongodb: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks:
      - ump_network
    volumes:
    - ./auth-service/logs:/app/logs
#      - ./logs/auth-service:/app/logs
  
  master-service:
    build:
      context: ./master-service
    container_name: ump_master_service
    restart: unless-stopped
    env_file: ./master-service/.env
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_pass_2024}@redis:6379
      AUTH_SERVICE_URL: http://auth-service:6001/api/v1
    ports:
      - "6002:6002"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      auth-service: { condition: service_started }
    networks:
      - ump_network
    volumes:
      - ./master-service/logs:/app/logs
#      - ./logs/master-service:/app/logs

  document-service:
    build:
      context: ./document-service
    container_name: ump_document_service
    restart: unless-stopped
    env_file: ./document-service/.env
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_pass_2024}@redis:6379
      AUTH_SERVICE_URL: http://auth-service:6001/api/v1
    ports:
      - "6003:6003"
    depends_on:
      mongodb: { condition: service_healthy }
      redis: { condition: service_healthy }
      auth-service: { condition: service_started }
    networks:
      - ump_network
    volumes:
      - doc_uploads:/app/uploads
      - doc_logs:/app/logs
      - ./document-service/logs:/app/logs
#      - ./logs/document-service:/app/logs
  # ─── API Gateway ─────────────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: ump_nginx
    restart: unless-stopped
    ports:
      - "8082:80"
      - "8443:443"
    volumes:
      - ./nginx/conf/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf/upstream.conf:/etc/nginx/conf.d/upstream.conf:ro
    depends_on:
      - auth-service
      - master-service
      - document-service
    networks:
      - ump_network

volumes:
  postgres_data:
  mongo_data:
  redis_data:
  auth_logs:
  master_logs:
  doc_uploads:
  doc_logs:

networks:
  ump_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
