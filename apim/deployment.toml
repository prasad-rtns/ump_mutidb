[server]
hostname = "$env{WSO2_HOST}"
internal_hostname = "$env{WSO2_HOST}"
#offset=0
base_path = "$env{WSO2_BASE_PATH}"
#discard_empty_caches = false
server_role = "default"

[super_admin]
username = "admin"
password = "admin"
create_admin_account = true

[user_store]
type = "database_unique_id"

[apim.devportal]
url = "$env{WSO2_DEVPORTAL_URL}"

[database.apim_db]
type = "h2"
url = "jdbc:h2:./repository/database/WSO2AM_DB;DB_CLOSE_ON_EXIT=FALSE"
username = "wso2carbon"
password = "wso2carbon"

[database.shared_db]
type = "h2"
url = "jdbc:h2:./repository/database/WSO2SHARED_DB;DB_CLOSE_ON_EXIT=FALSE"
username = "wso2carbon"
password = "wso2carbon"

[keystore.tls]
file_name = "wso2carbon.jks"
type = "JKS"
password = "wso2carbon"
alias = "wso2carbon"
key_password = "wso2carbon"

[[apim.gateway.environment]]
name = "Default"
type = "hybrid"
gateway_type = "Regular"
provider = "wso2"
display_in_api_console = true
description = "This is a hybrid gateway that handles both production and sandbox token traffic."
show_as_token_endpoint_url = true
service_url = "$env{WSO2_SERVICE_URL}"
username = "${admin.username}"
password = "${admin.password}"
ws_endpoint = "$env{WSO2_WS_ENDPOINT}"
wss_endpoint = "$env{WSO2_WSS_ENDPOINT}"
http_endpoint = "$env{WSO2_HTTP_ENDPOINT}"
https_endpoint = "$env{WSO2_HTTPS_ENDPOINT}"
websub_event_receiver_http_endpoint = "$env{WSO2_WEBSUB_HTTP_ENDPOINT}"
websub_event_receiver_https_endpoint = "$env{WSO2_WEBSUB_HTTPS_ENDPOINT}"

[[apim.gateway.environment.virtual_host]]
ws_endpoint = "ws://us.wso2.com:9099"
wss_endpoint = "wss://us.wso2.com:8099"
http_endpoint = "http://us.wso2.com/gateway"
https_endpoint = "https://us.wso2.com/gateway"
websub_event_receiver_http_endpoint = "http://us.wso2.com:9021"
websub_event_receiver_https_endpoint = "https://us.wso2.com:8021"

[[apim.gateway.environment.virtual_host]]
ws_endpoint = "ws://foods.com:9099"
wss_endpoint = "wss://foods.com:8099"
http_endpoint = "http://foods.com:8280"
https_endpoint = "https://foods.com:8243"
websub_event_receiver_http_endpoint = "http://foods.com:9021"
websub_event_receiver_https_endpoint = "https://foods.com:8021"

[apim.sync_runtime_artifacts.gateway]
gateway_labels = ["Default"]

[apim.analytics]
enable = false
auth_token = ""

[apim.ai]
enable = true
token = ""

[apim.key_manager]
enable_lightweight_apikey_generation = true

[apim.cors]
allow_origins = "*"
allow_methods = ["GET","PUT","POST","DELETE","PATCH","OPTIONS"]
allow_headers = ["authorization","Access-Control-Allow-Origin","Content-Type","SOAPAction","apikey","Internal-Key"]
allow_credentials = false

[[event_handler]]
name = "userPostSelfRegistration"
subscriptions = ["POST_ADD_USER"]

[service_provider]
sp_name_regex = "^[\\sa-zA-Z0-9._-]*$"

[database.local]
url = "jdbc:h2:./repository/database/WSO2CARBON_DB;DB_CLOSE_ON_EXIT=FALSE"

[[event_listener]]
id = "token_revocation"
type = "org.wso2.carbon.identity.core.handler.AbstractIdentityHandler"
name = "org.wso2.is.notification.ApimOauthEventInterceptor"
order = 1
[event_listener.properties]
notification_endpoint = "$env{WSO2_NOTIFICATION_ENDPOINT}"
username = "${admin.username}"
password = "${admin.password}"
'header.X-WSO2-KEY-MANAGER' = "default"

[oauth.grant_type.token_exchange]
enable = true
allow_refresh_tokens = true
iat_validity_period = "1h"
