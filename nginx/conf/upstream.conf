# ─── Upstream services ───────────────────────────────────────────────────────
upstream auth_service {
    server auth-service:6001;
    keepalive 32;
}

upstream master_service {
    server master-service:6002;
    keepalive 32;
}

upstream document_service {
    server document-service:6003;
    keepalive 32;
}

# ─── API Gateway ─────────────────────────────────────────────────────────────
server {
    listen 80;
    server_name localhost;

    # ─── Auth Service ──────────────────────────────────────────────────────────
    location /api/v1/auth/ {
        limit_req zone=auth_limit burst=10 nodelay;
        limit_conn conn_limit 20;

        proxy_pass http://auth_service;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # ─── Users Service ─────────────────────────────────────────────────────────
    location /api/v1/users/ {
        limit_req zone=api_limit burst=30 nodelay;

        proxy_pass http://auth_service;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 60s;
    }

    # ─── Master Service ────────────────────────────────────────────────────────
    location /api/v1/master/ {
        limit_req zone=api_limit burst=50 nodelay;

        proxy_pass http://master_service;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 30s;
    }

    # ─── Document Service ──────────────────────────────────────────────────────
    location /api/v1/documents/ {
        limit_req zone=api_limit burst=20 nodelay;
        client_max_body_size 100m;
        proxy_request_buffering off;

        proxy_pass http://document_service;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 120s;
    }

    # ─── Swagger Docs ──────────────────────────────────────────────────────────
    location /docs/auth/ {
        proxy_pass http://auth_service/api/docs/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /docs/master/ {
        proxy_pass http://master_service/api/docs/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /docs/documents/ {
        proxy_pass http://document_service/api/docs/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # ─── Health ────────────────────────────────────────────────────────────────
    location /health {
        access_log off;
        return 200 '{"status":"Gateway OK"}';
        add_header Content-Type application/json;
    }

    # ─── Default ───────────────────────────────────────────────────────────────
    location / {
        return 404 '{"success":false,"message":"Route not found"}';
        add_header Content-Type application/json;
    }
}
